# HTTP 응답 gzip 압축: 대시보드 목록/카테고리 JSON(다국어 필드 다수)이 크므로
# 전송 크기를 크게 줄인다(단일 512MB 다이노에서 첫 로딩 체감 개선). min-response-size
# 이상만 압축해 작은 응답의 오버헤드는 피한다.
server:
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: application/json,application/javascript,text/css,text/html,text/plain,text/xml,application/xml
    min-response-size: 1024
  servlet:
    session:
      cookie:
        # Apple form_post 콜백은 다른 사이트에서 POST 하므로 Lax 세션 쿠키가 안 붙는다.
        same-site: none
        secure: true

spring:
  # null 필드는 직렬화에서 제외 → 아직 채워지지 않은 다국어/부가 메타(En/Ja/Zh, budget 등)
  # 를 응답에서 빼 페이로드를 줄인다. 프론트는 모든 필드를 옵셔널(?.)/폴백으로 읽어 안전.
  jackson:
    default-property-inclusion: non_null
  datasource:
    hikari:
      connection-init-sql: SET NAMES utf8mb4
  web:
    resources:
      add-mappings: false  # SPA 폴백만 SpaResourceConfig에서 처리(동일 오리진 배포 시)
  config:
    import:
      - 'classpath:adapter-http-property.yml'
      - 'classpath:adapter-persistence-property.yml'
      - 'classpath:adapter-redis-property.yml'
  security:
    oauth2:
      client:
        registration:
          kakao:
            # Heroku: KAKAO_CLIENT_ID 사용 시 Circular reference → relaxed binding 이름으로만 참조
            client-id: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KAKAO_CLIENT_ID:}
            client-secret: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KAKAO_CLIENT_SECRET:}
            client-name: Kakao
            authorization-grant-type: authorization_code
            redirect-uri: "${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KAKAO_REDIRECT_URI:http://localhost:3000/login/oauth2/code/kakao}"
            scope:
              - profile_nickname
              - account_email
            client-authentication-method: client_secret_post
          apple:
            client-id: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_APPLE_CLIENT_ID:}
            client-secret: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_APPLE_CLIENT_SECRET:}
            client-name: Apple
            authorization-grant-type: authorization_code
            redirect-uri: "${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_APPLE_REDIRECT_URI:https://touraz-dvdholic-2194adc70fa6.herokuapp.com/login/oauth2/code/apple}"
            scope:
              - openid
              - name
              - email
            client-authentication-method: client_secret_post
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          apple:
            # issuer-uri 는 Apple OIDC discovery와 충돌하므로 쓰지 않는다.
            authorization-uri: https://appleid.apple.com/auth/authorize?response_mode=form_post
            token-uri: https://appleid.apple.com/auth/token
            jwk-set-uri: https://appleid.apple.com/auth/keys
            user-name-attribute: sub
# Heroku: JWT_SECRET/AES_SECRET에 "${JWT_SECRET}" 넣으면 Circular reference → APP_* 사용. 로컬은 JWT_SECRET/AES_SECRET 가능
jwt:
  secret: ${APP_JWT_SECRET:${JWT_SECRET:}}
  expire:
    access-token: 1
    refresh-token: 24

aes:
  secret: ${APP_AES_SECRET:${AES_SECRET:}}

# OpenAI (Heroku: OPENAI_API_KEY 설정)
openai:
  api-key: ${OPENAI_API_KEY:}

# Telegram Bot (Heroku: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID 설정)
telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  chat-id: ${TELEGRAM_CHAT_ID:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    shutdown:
      enabled: true
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
